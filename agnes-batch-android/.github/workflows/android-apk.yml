name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Core and mocked protocol tests
        run: python3 tools/test_core.py
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Android lint and APK build
        run: |
          set +e
          gradle --no-daemon lintDebug assembleDebug
          build_status=$?
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            cat app/build/reports/lint-results-debug.txt
          elif [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi
          exit "$build_status"
      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AgnesBatchAndroid.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/AgnesBatchAndroid.apk | tee dist/APK_SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging dist/AgnesBatchAndroid.apk | tee dist/APK_PACKAGE.txt
          apkanalyzer manifest print dist/AgnesBatchAndroid.apk | tee dist/APK_MANIFEST.xml
          python3 - <<'PY'
          import zipfile, xml.etree.ElementTree as ET
          with zipfile.ZipFile('dist/AgnesBatchAndroid.apk') as apk:
              assert apk.testzip() is None, 'APK archive is corrupt'
              for name in ('AndroidManifest.xml', 'classes.dex', 'resources.arsc'):
                  assert name in apk.namelist() and apk.getinfo(name).file_size > 0, name
          manifest = ET.parse('dist/APK_MANIFEST.xml').getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          assert manifest.get('package') == 'org.ngsmedia.agnesbatch', 'Unexpected package'
          sdk = manifest.find('uses-sdk')
          assert sdk is not None and sdk.get(android+'minSdkVersion') == '29', 'Unexpected minimum Android version: '+str(sdk.attrib if sdk is not None else None)
          assert sdk.get(android+'targetSdkVersion') == '35', 'Unexpected target Android version'
          activity = next((a for a in manifest.findall('./application/activity') if a.get(android+'name') in ('.MainActivity', 'org.ngsmedia.agnesbatch.MainActivity')), None)
          assert activity is not None and activity.get(android+'exported') == 'true', 'Main activity missing'
          assert any(f.find("action[@"+android+"name='android.intent.action.MAIN']") is not None and f.find("category[@"+android+"name='android.intent.category.LAUNCHER']") is not None for f in activity.findall('intent-filter')), 'Launcher missing'
          PY
      - name: Compute APK checksum
        working-directory: dist
        run: sha256sum AgnesBatchAndroid.apk > APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AgnesBatchAndroid-APK
          path: dist/
          if-no-files-found: error
