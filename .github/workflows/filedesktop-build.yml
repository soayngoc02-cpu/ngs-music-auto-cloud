name: Build File Desktop APK
on:
  push:
    branches: [build-file-desktop-20261010]
    paths:
      - 'filedesktop-build/project.tar.xz.b64'
      - '.github/workflows/filedesktop-build.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 35
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore project
        run: |
          echo '30815f17260b802c0f4fc5a787111e4ea0afcc4ef123bbe76507434339c39c13  filedesktop-build/project.tar.xz.b64' | sha256sum -c -
          mkdir -p filedesktop-src
          base64 --decode filedesktop-build/project.tar.xz.b64 | tar -xJf - -C filedesktop-src
          test -f filedesktop-src/app/build.gradle
      - name: Build debug APK
        run: gradle -p filedesktop-src --no-daemon --stacktrace assembleDebug
      - name: Publish APK
        run: |
          install -Dm644 filedesktop-src/app/build/outputs/apk/debug/app-debug.apk filedesktop-build/FileDesktop-v1.0.apk
          unzip -t filedesktop-build/FileDesktop-v1.0.apk | tail -n 1
          sha256sum filedesktop-build/FileDesktop-v1.0.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add filedesktop-build/FileDesktop-v1.0.apk
          git commit -m 'Build File Desktop v1.0 Android APK'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: FileDesktop-v1.0-APK
          path: filedesktop-build/FileDesktop-v1.0.apk
