name: Build YT Gon Android v1.1
# SDK 36 compatibility rebuild
on:
  push:
    branches: [build-yt-gon-v11-20261023]
    paths:
      - '.github/workflows/build-yt-gon-v11.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone GPL-licensed NewPipe v0.29.1
        run: |
          git clone --branch v0.29.1 --depth 1 https://github.com/TeamNewPipe/NewPipe.git yt-gon-src
          test -f yt-gon-src/gradlew
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Apply YT Gon modifications
        run: |
          set -e
          cp yt-gon/ytgon-patch.py yt-gon-src/ytgon-patch.py
          cd yt-gon-src
          python3 ytgon-patch.py
          grep -q 'com.binh.ytgon.v11' app/build.gradle.kts
          grep -q 'applyVerticalSwipe' app/src/main/java/org/schabi/newpipe/player/gesture/MainPlayerGestureListener.kt
          ! grep -q 'onScrollVolume' app/src/main/java/org/schabi/newpipe/player/gesture/MainPlayerGestureListener.kt
          grep -q 'enable_search_history_key' app/src/main/java/org/schabi/newpipe/MainActivity.java
          grep -q 'openSearchFragment(getSupportFragmentManager(), 0' app/src/main/java/org/schabi/newpipe/MainActivity.java
      - name: Build YT Gon APK
        working-directory: yt-gon-src
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g'
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace -DskipFormatKtlint=true -x :app:runCheckstyle -x :app:runKtlint -x :app:checkDependenciesOrder
      - name: Verify and publish
        run: |
          set -e
          install -Dm644 yt-gon-src/app/build/outputs/apk/debug/app-debug.apk yt-gon/YT-Gon-v1.1.apk
          unzip -t yt-gon/YT-Gon-v1.1.apk | tail -n1
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging yt-gon/YT-Gon-v1.1.apk | grep -E 'package:|application-label:'
          sha256sum yt-gon/YT-Gon-v1.1.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yt-gon/YT-Gon-v1.1.apk
          git commit -m 'Build YT Gon Android v1.1'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Gon-v1.1-APK
          path: yt-gon/YT-Gon-v1.1.apk
