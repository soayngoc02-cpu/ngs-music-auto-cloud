name: Smart Subtitle CI

on:
  push:
    branches: [main]
    paths:
      - 'app/smart_subtitles.py'
      - 'scripts/render_from_job.py'
      - '.github/workflows/smart-subtitle-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Smart Subtitle code
        run: python -m py_compile app/smart_subtitles.py scripts/render_from_job.py
      - name: Test vocal-timed fallback
        run: |
          python - <<'PY'
          from app.smart_subtitles import _fallback_vocal_timing

          lines = [
              'Anh vẫn nhớ em',
              'Những ngày mình bên nhau',
              'Giờ chỉ còn mình anh',
          ]
          words = [
              {'start': 0.8, 'end': 1.2, 'probability': 0.8},
              {'start': 1.3, 'end': 1.7, 'probability': 0.8},
              {'start': 2.0, 'end': 2.4, 'probability': 0.8},
              {'start': 3.4, 'end': 3.8, 'probability': 0.8},
              {'start': 4.0, 'end': 4.4, 'probability': 0.8},
              {'start': 5.6, 'end': 6.0, 'probability': 0.8},
              {'start': 6.2, 'end': 6.7, 'probability': 0.8},
          ]
          events = _fallback_vocal_timing(lines, words, 0, 8, 8)
          assert events, 'fallback generated no subtitle events'
          assert all(e.end > e.start for e in events)
          assert events[0].start >= 0.7
          print('Smart subtitle fallback OK:', [(e.text, e.start, e.end) for e in events])
          PY
