name: Build NGS Music Visualizer APK

on:
  push:
    branches:
      - android-visualizer
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch compiler compatibility
        run: |
          sed -i 's/Pair<IntArray,IntArray>=/Pair<IntArray,IntArray> =/' android-visualizer/app/src/main/java/com/ngsmusic/visualizer/GlVisualizerRenderer.kt
          sed -i '/import android.media.ImageDecoder/d' android-visualizer/app/src/main/java/com/ngsmusic/visualizer/MainActivity.kt
          sed -i 's/ScrollView.LayoutParams(-1,-2)/FrameLayout.LayoutParams(-1,-2)/' android-visualizer/app/src/main/java/com/ngsmusic/visualizer/MainActivity.kt

      - name: Build debug APK
        working-directory: android-visualizer
        run: gradle assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NGS-Music-Visualizer-APK
          path: android-visualizer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
