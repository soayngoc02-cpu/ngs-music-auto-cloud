name: Build YT Sub Transcript APK
on:
  push:
    branches: [build-yt-sub-apk-20261009]
    paths:
      - 'yt-build/project.tar.xz.b64'
      - '.github/workflows/build-yt-sub-transcript-apk.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 from preinstalled runner tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore app source
        run: |
          mkdir -p apk-source
          echo 'af3b218e3c2f170f4ce0a960c1bf6f450b42cb12d3e67a3db768ac18b5654c41  yt-build/project.tar.xz.b64' | sha256sum -c -
          base64 --decode yt-build/project.tar.xz.b64 | tar -xJf - -C apk-source
          test -f apk-source/app/build.gradle
      - name: Compile signed debug APK
        run: cd apk-source && gradle --no-daemon assembleDebug
      - name: Copy and validate APK
        run: |
          install -Dm644 apk-source/app/build/outputs/apk/debug/app-debug.apk yt-build/YT-Sub-Transcript-v1.1.apk
          test -s yt-build/YT-Sub-Transcript-v1.1.apk
          unzip -t yt-build/YT-Sub-Transcript-v1.1.apk | tail -1
          sha256sum yt-build/YT-Sub-Transcript-v1.1.apk
      - name: Publish built APK to dedicated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yt-build/YT-Sub-Transcript-v1.1.apk
          git commit -m 'Built Android APK artifact'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Sub-Transcript-v1.1-APK
          path: yt-build/YT-Sub-Transcript-v1.1.apk
