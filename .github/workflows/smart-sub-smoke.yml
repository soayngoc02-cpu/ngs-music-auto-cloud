name: Smart Subtitle Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smart-sub-smoke.yml'
      - 'app/smart_subtitles.py'
      - 'scripts/smart_sub_smoke.py'
      - 'requirements-smart.txt'

permissions:
  contents: read

jobs:
  smart-sub:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig
      - name: Install core dependencies
        run: pip install -r requirements.txt
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ngs-faster-whisper-small-v1
          restore-keys: |
            ngs-faster-whisper-
      - name: Install smart subtitle dependencies
        run: pip install -r requirements-smart.txt
      - name: Run smart subtitle smoke test on real R2 music
        run: python scripts/smart_sub_smoke.py
