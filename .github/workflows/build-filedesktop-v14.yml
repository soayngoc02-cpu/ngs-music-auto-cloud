name: Build File Desktop v1.4 APK
on:
  push:
    branches: [build-file-desktop-v14-20261011]
    paths:
      - '.github/workflows/build-filedesktop-v14.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore Android source
        run: |
          set -e
          cat filedesktop-v14/project.part{0,1,2,3,4}.b64 > filedesktop-v14/project.tar.xz.b64
          echo '218a009942cd56db1d9ff3e04d5e15f2d63527c6383844fa1d4644103941680c  filedesktop-v14/project.tar.xz.b64' | sha256sum -c -
          mkdir -p filedesktop-src
          base64 -d filedesktop-v14/project.tar.xz.b64 | tar -xJf - -C filedesktop-src
          grep -q "versionName '1.4'" filedesktop-src/app/build.gradle
          grep -q 'canPreviewAudio' filedesktop-src/app/src/main/java/com/filedesktop/app/PreviewActivity.java
          ! grep -q 'Thoát File Desktop?' filedesktop-src/app/src/main/java/com/filedesktop/app/MainActivity.java
          grep -q 'enableOnBackInvokedCallback' filedesktop-src/app/src/main/AndroidManifest.xml
      - name: Compile Android APK
        run: gradle -p filedesktop-src --no-daemon --stacktrace assembleDebug
      - name: Verify and publish APK
        run: |
          set -e
          install -Dm644 filedesktop-src/app/build/outputs/apk/debug/app-debug.apk filedesktop-v14/FileDesktop-v1.4.apk
          unzip -t filedesktop-v14/FileDesktop-v1.4.apk | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging filedesktop-v14/FileDesktop-v1.4.apk | grep -E 'package:|application-label:'
          sha256sum filedesktop-v14/FileDesktop-v1.4.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add filedesktop-v14/FileDesktop-v1.4.apk
          git commit -m 'Build File Desktop 1.4 APK'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: FileDesktop-v1.4-APK
          path: filedesktop-v14/FileDesktop-v1.4.apk
