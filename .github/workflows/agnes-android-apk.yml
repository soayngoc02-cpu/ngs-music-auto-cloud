name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [build-agnes-apk]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agnes-batch-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Core and mocked protocol tests
        run: python3 tools/test_core.py
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Android lint and APK build
        run: gradle --no-daemon lintDebug assembleDebug
      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AgnesBatchAndroid.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/AgnesBatchAndroid.apk | tee dist/APK_SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging dist/AgnesBatchAndroid.apk > dist/APK_PACKAGE.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/AgnesBatchAndroid.apk') as apk:
              assert apk.testzip() is None, 'APK archive is corrupt'
              for name in ('AndroidManifest.xml', 'classes.dex', 'resources.arsc'):
                  assert name in apk.namelist() and apk.getinfo(name).file_size > 0, name
          package = open('dist/APK_PACKAGE.txt', encoding='utf-8').read()
          assert "name='org.ngsmedia.agnesbatch'" in package, 'Unexpected package'
          assert "sdkVersion:'29'" in package, 'Unexpected minimum Android version'
          assert "launchable-activity: name='org.ngsmedia.agnesbatch.MainActivity'" in package, 'Launcher missing'
          PY
      - name: Compute APK checksum
        working-directory: agnes-batch-android/dist
        run: sha256sum AgnesBatchAndroid.apk > APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AgnesBatchAndroid-APK
          path: agnes-batch-android/dist/
          if-no-files-found: error
