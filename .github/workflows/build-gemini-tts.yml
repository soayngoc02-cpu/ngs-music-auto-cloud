name: Build Gemini TTS Android APK
on:
  push:
    branches: [build-gemini-tts-20261011]
    paths:
      - '.github/workflows/build-gemini-tts.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore verified Android project
        run: |
          set -e
          cat gemini-tts-build/source.part{0,1,2,3}.b64 > gemini-tts-build/source.tar.xz.b64
          echo 'c9670ca6535c5fdad8088bad1a2d159c22632efad1425101defdc07acd076387  gemini-tts-build/source.tar.xz.b64' | sha256sum -c -
          mkdir -p gemini-tts-src
          base64 -d gemini-tts-build/source.tar.xz.b64 | tar -xJf - -C gemini-tts-src
          test -f gemini-tts-src/app/build.gradle
      - name: Fix TXT import compilation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gemini-tts-src/app/src/main/java/com/mekong/geminitts/MainActivity.java')
          x=p.read_text()
          x=x.replace('String result=new String(bytes.toByteArray(),StandardCharsets.UTF_8);','String imported=new String(bytes.toByteArray(),StandardCharsets.UTF_8);')
          x=x.replace('if(result.startsWith(', 'if(imported.startsWith(')
          x=x.replace('result=result.substring(1);','imported=imported.substring(1);')
          x=x.replace('textBox.setText(result);','textBox.setText(imported);')
          x=x.replace('result.length()+" ký tự','imported.length()+" ký tự')
          x=x.replace('Job.split(result).size()','Job.split(imported).size()')
          p.write_text(x)
          PY
      - name: Build debug APK
        run: gradle -p gemini-tts-src --no-daemon --stacktrace assembleDebug
      - name: Verify and publish APK
        run: |
          install -Dm644 gemini-tts-src/app/build/outputs/apk/debug/app-debug.apk gemini-tts-build/Gemini-TTS-Truyen-v1.0.apk
          unzip -t gemini-tts-build/Gemini-TTS-Truyen-v1.0.apk | tail -n 1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging gemini-tts-build/Gemini-TTS-Truyen-v1.0.apk | grep -E 'package:|application-label:'
          sha256sum gemini-tts-build/Gemini-TTS-Truyen-v1.0.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gemini-tts-build/Gemini-TTS-Truyen-v1.0.apk
          git commit -m 'Build Gemini TTS Truyen Android v1.0'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-TTS-Truyen-v1.0-APK
          path: gemini-tts-build/Gemini-TTS-Truyen-v1.0.apk
