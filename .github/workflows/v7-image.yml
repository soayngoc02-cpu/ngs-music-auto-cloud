name: Build NGS Studio V7 image
on:
  push:
    branches: [ngs-studio-v7-online]
    paths:
      - 'studio-v7/**'
      - 'Dockerfile.v7'
      - '.github/workflows/v7-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.v7
          push: true
          tags: ghcr.io/soayngoc02-cpu/ngs-music-studio-v7:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
