name: Build Gemini TTS v1.2 APK
on:
  push:
    branches: [build-gemini-tts-v12-20261011]
    paths:
      - '.github/workflows/build-gemini-tts-v12.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore verified source
        run: |
          set -e
          cat gemini-tts-v12/project.part{0,1,2,3,4,5,6,7,8}.b64 > gemini-tts-v12/project.tar.xz.b64
          echo 'dcd666971a876cef3b03a0200c2aff792e9b64d6b2d4491d05d01e8a8c91b6e8  gemini-tts-v12/project.tar.xz.b64' | sha256sum -c -
          mkdir -p gemini-tts-src
          base64 -d gemini-tts-v12/project.tar.xz.b64 | tar -xJf - -C gemini-tts-src
          grep -q "versionName '1.2'" gemini-tts-src/app/build.gradle
          grep -q 'createUniqueDirectory' gemini-tts-src/app/src/main/java/com/mekong/geminitts/Storage.java
          grep -q 'job.title=folder.name' gemini-tts-src/app/src/main/java/com/mekong/geminitts/MainActivity.java
          grep -q 'store.createFile(Uri.parse(job.dir)' gemini-tts-src/app/src/main/java/com/mekong/geminitts/Wave.java
      - name: Assemble debug APK
        run: gradle -p gemini-tts-src --no-daemon --stacktrace assembleDebug
      - name: Validate and publish APK
        run: |
          set -e
          install -Dm644 gemini-tts-src/app/build/outputs/apk/debug/app-debug.apk gemini-tts-v12/Gemini-TTS-Truyen-v1.2.apk
          unzip -t gemini-tts-v12/Gemini-TTS-Truyen-v1.2.apk | tail -n 1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging gemini-tts-v12/Gemini-TTS-Truyen-v1.2.apk | grep -E 'package:|application-label:'
          sha256sum gemini-tts-v12/Gemini-TTS-Truyen-v1.2.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gemini-tts-v12/Gemini-TTS-Truyen-v1.2.apk
          git commit -m 'Build Gemini TTS Truyen 1.2 APK'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-TTS-Truyen-v1.2-APK
          path: gemini-tts-v12/Gemini-TTS-Truyen-v1.2.apk
