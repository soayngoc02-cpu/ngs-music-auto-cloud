name: Build File Desktop Dark v1.1
on:
  push:
    branches: [build-file-desktop-20261010]
    paths:
      - '.github/workflows/build-filedesktop-v11.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore baseline project
        run: |
          echo '2c81b477710e76b87976cdb354a6337d8d93ea63399b8ea90ef7e74e163668a5  filedesktop-build/project.tar.xz.b64' | sha256sum -c -
          mkdir -p filedesktop-src
          base64 -d filedesktop-build/project.tar.xz.b64 | tar -xJf - -C filedesktop-src
      - name: Apply File Desktop 1.1 changes
        run: python3 filedesktop-build/apply-v11.py
      - name: Compile APK
        run: gradle -p filedesktop-src --no-daemon assembleDebug
      - name: Publish APK
        run: |
          install -Dm644 filedesktop-src/app/build/outputs/apk/debug/app-debug.apk filedesktop-build/FileDesktop-v1.1.apk
          unzip -t filedesktop-build/FileDesktop-v1.1.apk | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging filedesktop-build/FileDesktop-v1.1.apk | grep -E 'package:|application-label:'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add filedesktop-build/FileDesktop-v1.1.apk
          git commit -m 'File Desktop v1.1 APK'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: FileDesktop-v1.1-APK
          path: filedesktop-build/FileDesktop-v1.1.apk
