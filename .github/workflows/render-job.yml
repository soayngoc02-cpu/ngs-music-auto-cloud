name: Render Job

on:
  workflow_dispatch:
    inputs:
      job_key:
        description: 'R2 job JSON key, e.g. jobs/pending/C001.json'
        required: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg and subtitle fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig

      - name: Install core Python dependencies
        run: pip install -r requirements.txt

      - name: Detect smart subtitle requirement
        id: features
        run: echo "smart_sub=$(python scripts/job_features.py \"${{ inputs.job_key }}\")" >> "$GITHUB_OUTPUT"

      - name: Cache Whisper model
        if: steps.features.outputs.smart_sub == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ngs-faster-whisper-small-v1
          restore-keys: |
            ngs-faster-whisper-

      - name: Install smart subtitle dependencies
        if: steps.features.outputs.smart_sub == 'true'
        run: pip install -r requirements-smart.txt

      - name: Render job from R2
        run: python scripts/render_from_job.py "${{ inputs.job_key }}"
