name: Render Job

on:
  workflow_dispatch:
    inputs:
      job_key:
        description: 'R2 job JSON key, e.g. jobs/pending/C001.json'
        required: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      HF_HOME: /home/runner/.cache/huggingface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-smart.txt

      - name: Install FFmpeg and subtitle fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: ngs-faster-whisper-models-v1
          restore-keys: |
            ngs-faster-whisper-models-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-smart.txt

      - name: Verify Smart Sync dependency
        run: |
          python - <<'PY'
          import faster_whisper
          from faster_whisper import WhisperModel
          print('faster-whisper OK:', getattr(faster_whisper, '__version__', 'unknown'))
          print('WhisperModel import OK:', WhisperModel.__name__)
          PY

      - name: Render job from R2
        run: python scripts/render_from_job.py "${{ inputs.job_key }}"
