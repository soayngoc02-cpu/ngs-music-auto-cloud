name: Media Timeline Smoke

on:
  push:
    branches: [main]
    paths:
      - 'app/render.py'
      - 'app/job_model.py'
      - 'app/smart_subtitles_v2.py'
      - 'scripts/render_from_job.py'
      - 'scripts/smoke_media_timeline.py'
      - '.github/workflows/media-timeline-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Run media timeline smoke
        id: smoke
        continue-on-error: true
        run: PYTHONPATH=. python scripts/smoke_media_timeline.py
      - name: Publish smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          OUTCOME: ${{ steps.smoke.outcome }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$OUTCOME" = "success" ]; then STATE=success; DESC="multi-media + subtitle gap smoke passed"; else STATE=failure; DESC="multi-media + subtitle gap smoke failed"; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"ngs/media-timeline-smoke\",\"description\":\"$DESC\"}"
      - name: Fail workflow when smoke failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
