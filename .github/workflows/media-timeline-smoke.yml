name: Media Timeline Smoke

on:
  push:
    branches: [main]
    paths:
      - 'app/render.py'
      - 'app/job_model.py'
      - 'app/smart_subtitles_v2.py'
      - 'scripts/render_from_job.py'
      - 'scripts/smoke_media_timeline.py'
      - '.github/workflows/media-timeline-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Run media timeline smoke
        run: PYTHONPATH=. python scripts/smoke_media_timeline.py
